# Your nginx rules, included inside the `server { }` block.
#
# The site root is already set to the snap's site/ folder, so plain paths
# map to files in site/. Validate changes with tests/lxd-smoke.sh before
# publishing: an invalid file makes the snap fail to install.
# More recipes: docs/customizing.md

# Serve files, then directories (index.html), else 404.
location / {
    try_files $uri $uri/ =404;
}

# Custom error page, served from site/404.html.
error_page 404 /404.html;

